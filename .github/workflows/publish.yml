name: Publish portfolio
on:
  push:
    paths:
      - '.github/workflows/publish.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the approved portfolio
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, urllib.request
          origin = 'https://neeral-design-portfolio.nwadhwani.chatgpt.site/'
          for name in json.loads(pathlib.Path('.github/site-files.json').read_text()):
              dest = pathlib.Path(name)
              if name == '.nojekyll':
                  dest.touch()
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(origin + name) as response:
                  dest.write_bytes(response.read())
          PYTHON
      - name: Save portfolio files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Add approved portfolio and final resume'
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
