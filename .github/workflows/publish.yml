name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble approved portfolio
        if: hashFiles('.github/migration/part-*') != ''
        run: |
          cat .github/migration/part-* > /tmp/portfolio.tar.gz
          echo '84e027013f0af58d45231e50ec42f63fa83525063bfd456562e1c4e9bd319f95  /tmp/portfolio.tar.gz' | sha256sum -c -
          tar -xzf /tmp/portfolio.tar.gz
          rm -r .github/migration
          rm .github/site-files.json
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Save complete portfolio with recordings and final resume'
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
